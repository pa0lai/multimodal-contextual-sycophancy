[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-contextual-sycophancy"
version = "0.1.0"
description = "Evaluation code and camera-ready artifacts for diagnosing multimodal contextual sycophancy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pillow>=10.0", "python-dotenv>=1.0", "requests>=2.32", "tqdm>=4.66"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
collectors = ["datasets>=3.0", "huggingface-hub>=0.28"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
